<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Árvore formal da linha de Araújo</title>
  <desc id="desc">Estrutura hierárquica para oré rembi'u 'ara îabi'õndûara eîme'eng kori orébe.</desc>
  <defs>
    <style>
      .bg{fill:#fffaf0}
      .edge{stroke:#6f5b35;stroke-width:3;fill:none}
      .edge2{stroke:#4f8a82;stroke-width:3;fill:none}
      .node{fill:#f7f1e6;stroke:#6f5b35;stroke-width:2.5}
      .node2{fill:#ecf4ef;stroke:#4f8a82;stroke-width:2.5}
      .node3{fill:#f7e6de;stroke:#a5432d;stroke-width:2.5}
      .small{font:600 18px Arial, sans-serif;fill:#2a302c}
      .label{font:700 22px Arial, sans-serif;fill:#1f2421}
      .mono{font:700 19px Menlo, Consolas, monospace;fill:#1f2421}
      .caption{font:600 16px Arial, sans-serif;fill:#6b6257}
      .surface{font:700 28px Georgia, serif;fill:#1f2421}
      .tag{font:700 15px Arial, sans-serif;fill:#a5432d}
    </style>
  </defs>
  <rect class="bg" width="1180" height="720"/>

  <text x="590" y="48" text-anchor="middle" class="surface">oré rembi'u 'ara îabi'õndûara eîme'eng kori orébe</text>
  <text x="590" y="76" text-anchor="middle" class="caption">araujo_catecismo_1686:0007 · forma gerada e alvo normalizado</text>

  <rect x="462" y="102" width="256" height="66" rx="6" class="node3"/>
  <text x="590" y="130" text-anchor="middle" class="tag">SENTENÇA</text>
